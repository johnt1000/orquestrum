name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra ui --group dev

      - name: Lint (orquestrum lint)
        run: uv run orquestrum lint

      - name: Unit + integration tests
        run: uv run pytest tests/ -q --tb=short

      - name: Provider parity (dry run)
        run: uv run orquestrum convert --all --provider claude --dry-run
