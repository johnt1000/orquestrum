# Pinned commit SHAs for external dependencies installed by `orquestrum deps`.
#
# Why: cloning the upstream default branch lets a malicious or accidental
# upstream commit land silently in every install. Pinning makes the supply
# chain auditable — every install consumes the SHA listed here.
#
# Rotation:
#   orquestrum deps --update-pins          # fetches latest HEAD per repo, rewrites this file
#   git diff pinned_refs.toml              # review SHA changes
#   git commit -m "chore(deps): rotate pinned SHAs (YYYY-MM-DD)"
#
# Policy: see docs/governance/SUPPLY_CHAIN.md.

[[refs]]
name        = "agency"
repo        = "https://github.com/msitarzewski/agency-agents.git"
sha         = "783f6a72bfd7f3135700ac273c619d92821b419a"
last_pinned = "2026-05-01"
notes       = "184+ specialized agents; convert.sh produces integrations/opencode/agents/."

