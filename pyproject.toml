[project]
name = "orquestrum"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "mistune>=3.0",
    "watchfiles>=0.24",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]
