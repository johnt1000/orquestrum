[project]
name = "orquestrum"
version = "0.5.1"
description = "Specification-Driven Development framework for multi-agent AI systems (Mac & Linux)."
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1",
    # MCP server (orquestrum mcp): exposes orq_* tools to LLM agents.
    # Includes Pydantic for input validation. The official MCP Python SDK
    # bundles FastMCP under `mcp.server.fastmcp`.
    "mcp>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
orquestrum = "orquestrum.cli:main"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "mistune>=3.0",
    "watchfiles>=0.24",
    "python-multipart>=0.0.20",
]
webview = [
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orquestrum", "ui"]

# Canonical SDD assets are shipped INSIDE the wheel under orquestrum/_assets/
# so the CLI works from any cwd after `uv tool install orquestrum`. When the
# CLI runs from a clone of the canonical repo, paths.py prefers the on-disk
# tree (dev mode) so contributors keep editing source directly.
[tool.hatch.build.targets.wheel.force-include]
"agents"                    = "orquestrum/_assets/agents"
"skills"                    = "orquestrum/_assets/skills"
"docs/agent-context"        = "orquestrum/_assets/docs/agent-context"
"docs/governance"           = "orquestrum/_assets/docs/governance"
"bundle/archive-cleanup.sh" = "orquestrum/_assets/bundle/archive-cleanup.sh"
"pinned_refs.toml"          = "orquestrum/_assets/pinned_refs.toml"

[tool.hatch.build.targets.sdist]
include = [
    "orquestrum",
    "ui",
    "agents",
    "skills",
    "docs/agent-context",
    "docs/governance",
    "bundle",
    "pinned_refs.toml",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "Makefile",
    "CLAUDE.md",
    "CONTRIBUTING.md",
]
