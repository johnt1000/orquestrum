[project]
name = "orquestrum"
version = "0.2.0"
description = "Specification-Driven Development framework for multi-agent AI systems (Mac & Linux)."
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1",
]

[project.scripts]
orquestrum = "orquestrum.cli:main"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "mistune>=3.0",
    "watchfiles>=0.24",
    "python-multipart>=0.0.20",
]
webview = [
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orquestrum", "ui"]
